<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    #user-card { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    #user-card:active { opacity: 0.75; }
    .user-avatar {
      width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
      background: #2481cc; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .calendar {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 14px; padding: 14px; margin-top: 10px; margin-bottom: 10px;
    }
    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .cal-title { font-size: 15px; font-weight: 700; text-transform: capitalize; }
    .cal-nav {
      background: none; border: none; font-size: 20px; cursor: pointer;
      color: var(--tg-theme-button-color, #2481cc); padding: 0 8px; line-height: 1;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow {
      text-align: center; font-size: 11px; opacity: 0.5;
      padding: 4px 0; font-weight: 600;
    }
    .cal-day {
      text-align: center; padding: 6px 2px; font-size: 13px;
      border-radius: 8px; cursor: default; line-height: 1.4;
    }
    .cal-day.today { font-weight: 700; color: var(--tg-theme-button-color, #2481cc); }
    .cal-day.has-workout {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      cursor: pointer; font-weight: 600;
    }
    .cal-day.has-workout:active { opacity: 0.75; }

    .habits {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 14px; padding: 14px; margin: 10px 0;
    }
    .habits-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .habits-title { font-size:15px; font-weight:700; }
    .habits-range { font-size:12px; opacity:.55; margin-top:3px; }
    .habits-nav { display:flex; gap:4px; }
    .habits-nav button {
      width:44px; height:44px; border:0; border-radius:12px; background:transparent;
      color:var(--tg-theme-button-color, #2481cc); font-size:22px; cursor:pointer;
    }
    .habits-table-wrap { overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:none; }
    .habits-table-wrap::-webkit-scrollbar { display:none; }
    .habits-table { border-collapse:separate; border-spacing:4px; width:100%; min-width:390px; table-layout:fixed; }
    .habits-table th { font-size:10px; font-weight:600; opacity:.55; text-align:center; }
    .habits-table th:first-child { width:112px; text-align:left; opacity:1; }
    .habit-date { display:block; font-size:12px; margin-top:2px; }
    .habit-today { color:var(--tg-theme-button-color, #2481cc); opacity:1 !important; }
    .habit-label { font-size:12px; line-height:1.2; text-align:left; font-weight:600; }
    .habit-check {
      appearance:none; -webkit-appearance:none; width:34px; height:34px; margin:0;
      border:2px solid rgba(120,120,128,.25); border-radius:10px; background:var(--tg-theme-bg-color, #fff);
      cursor:pointer; position:relative; vertical-align:middle;
    }
    .habit-check:checked { background:var(--tg-theme-button-color, #2481cc); border-color:var(--tg-theme-button-color, #2481cc); }
    .habit-check:checked::after {
      content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:22px; font-weight:800;
    }
    .habit-check:disabled { opacity:.22; cursor:default; background:transparent; }
    .habit-cell { text-align:center; height:42px; }
    .habits-error { color:#c33; font-size:12px; text-align:center; padding-top:8px; }
  </style>
</head>
<body>
  <div class="header">💪 Gym Tracker</div>

  <div class="page">
    <div class="card" id="user-card" onclick="location.href='/profile.html'" style="cursor:pointer">
      <div id="user-avatar-wrap"></div>
      <div style="flex:1">
        <div style="font-size:15px; font-weight:600" id="user-name">...</div>
        <div style="font-size:13px; opacity:0.5; margin-top:4px" id="user-greeting"></div>
      </div>
      <span style="opacity:0.3;font-size:18px">›</span>
    </div>

    <div class="nav-grid">
      <button class="nav-card" id="workout-btn" onclick="goToTodayWorkout()">
        <span class="nav-emoji">🏋️</span>
        <span class="nav-label">Тренировка</span>
      </button>
      <button class="nav-card" onclick="location.href='/history.html'">
        <span class="nav-emoji">📋</span>
        <span class="nav-label">История</span>
      </button>
      <button class="nav-card" onclick="location.href='/measurements.html'">
        <span class="nav-emoji">📏</span>
        <span class="nav-label">Замеры</span>
      </button>
      <button class="nav-card" onclick="location.href='/nutrition.html'">
        <span class="nav-emoji">🥗</span>
        <span class="nav-label">Питание</span>
      </button>
      <button class="nav-card" onclick="location.href='/exercises.html'" style="grid-column:span 2">
        <span class="nav-emoji">📚</span>
        <span class="nav-label">Мои упражнения</span>
      </button>
    </div>

    <div id="calendar"></div>
    <div id="habits"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/cache.js"></script>
  <script>
    if (!localStorage.getItem('gymToken')) { location.href = '/login.html'; }

    const DAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                    'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

    let workouts = [];
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let habitsWeekStart = startOfWeek(new Date());
    let habits = {};

    function localToday() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function dateKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function startOfWeek(date) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return d;
    }

    function weekDates() {
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(habitsWeekStart);
        d.setDate(d.getDate() + i);
        return d;
      });
    }

    function renderHabits(error = '') {
      const dates = weekDates();
      const today = localToday();
      const range = `${dates[0].getDate()} ${MONTHS[dates[0].getMonth()].toLowerCase()} — ${dates[6].getDate()} ${MONTHS[dates[6].getMonth()].toLowerCase()}`;
      const rows = [
        ['english', '🇬🇧 Английский'],
        ['activity', '🏃 Тренировка / 10 000 шагов'],
        ['nutrition', '🥗 Правильное питание']
      ];

      let html = `<div class="habits">
        <div class="habits-header">
          <div><div class="habits-title">Мои привычки</div><div class="habits-range">${range}</div></div>
          <div class="habits-nav">
            <button aria-label="Предыдущая неделя" onclick="changeHabitsWeek(-1)">‹</button>
            <button aria-label="Следующая неделя" onclick="changeHabitsWeek(1)">›</button>
          </div>
        </div>
        <div class="habits-table-wrap"><table class="habits-table"><thead><tr><th>Привычка</th>`;

      for (const d of dates) {
        const key = dateKey(d);
        html += `<th class="${key === today ? 'habit-today' : ''}">${DAYS[(d.getDay()+6)%7]}<span class="habit-date">${d.getDate()}</span></th>`;
      }
      html += '</tr></thead><tbody>';

      for (const [habit, label] of rows) {
        html += `<tr><td class="habit-label">${label}</td>`;
        for (const d of dates) {
          const key = dateKey(d);
          const weekendEnglish = habit === 'english' && (d.getDay() === 0 || d.getDay() === 6);
          const checked = Boolean(habits[key]?.[habit]);
          html += `<td class="habit-cell"><input class="habit-check" type="checkbox"
            aria-label="${label}, ${key}" ${checked ? 'checked' : ''} ${weekendEnglish ? 'disabled' : ''}
            onchange="toggleHabit('${key}','${habit}',this.checked,this)"></td>`;
        }
        html += '</tr>';
      }
      html += `</tbody></table></div>${error ? `<div class="habits-error">${error}</div>` : ''}</div>`;
      document.getElementById('habits').innerHTML = html;
    }

    async function loadHabits() {
      const dates = weekDates();
      try {
        const rows = await api.get(`/api/habits?from=${dateKey(dates[0])}&to=${dateKey(dates[6])}`);
        habits = {};
        for (const row of rows) habits[row.date] = row;
        renderHabits();
      } catch (e) {
        renderHabits('Не удалось загрузить отметки');
      }
    }

    function changeHabitsWeek(delta) {
      habitsWeekStart.setDate(habitsWeekStart.getDate() + delta * 7);
      renderHabits();
      loadHabits();
    }

    async function toggleHabit(date, habit, checked, input) {
      input.disabled = true;
      try {
        const row = await api.put(`/api/habits/${date}`, { habit, checked });
        habits[date] = row;
      } catch (e) {
        input.checked = !checked;
        renderHabits('Не удалось сохранить отметку');
      } finally {
        input.disabled = false;
      }
    }

    function buildWorkoutDayMap() {
      const map = {};
      for (const w of workouts) {
        const key = String(w.date).slice(0, 10);
        if (!map[key]) map[key] = w.id; // keep first = newest (list sorted by date DESC)
      }
      return map;
    }

    function renderCalendar() {
      const dayMap = buildWorkoutDayMap();
      const todayKey = localToday();
      const firstDay = new Date(calYear, calMonth, 1);
      let startDow = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

      let html = `<div class="calendar">
        <div class="cal-header">
          <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
          <span class="cal-title">${MONTHS[calMonth]} ${calYear}</span>
          <button class="cal-nav" onclick="changeMonth(1)">›</button>
        </div>
        <div class="cal-grid">`;

      for (const d of DAYS) html += `<div class="cal-dow">${d}</div>`;
      for (let i = 0; i < startDow; i++) html += `<div class="cal-day empty"></div>`;

      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = key === todayKey;
        const wid = dayMap[key];
        let cls = 'cal-day' + (wid ? ' has-workout' : '') + (isToday ? ' today' : '');
        const onclick = wid ? `onclick="location.href='/workout.html?id=${wid}'"` : '';
        html += `<div class="${cls}" ${onclick}>${d}</div>`;
      }

      html += `</div></div>`;
      document.getElementById('calendar').innerHTML = html;
    }

    function changeMonth(delta) {
      calMonth += delta;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    }

    async function loadWorkouts() {
      const cached = dataCache.get('workouts');
      if (cached) { workouts = cached; renderCalendar(); }
      const fresh = await api.get('/api/workouts');
      workouts = fresh;
      dataCache.set('workouts', fresh);
      renderCalendar();
    }

    async function goToTodayWorkout() {
      const btn = document.getElementById('workout-btn');
      btn.style.opacity = '0.5';
      try {
        const today = localToday();
        // Always fetch fresh — stale cache could miss a just-created workout
        // and cause a duplicate to be created
        const list = await api.get('/api/workouts');
        workouts = list;
        dataCache.set('workouts', list);
        const todayWorkout = list.find(w => String(w.date).slice(0, 10) === today);
        location.href = todayWorkout ? `/workout.html?id=${todayWorkout.id}` : '/workout.html';
      } catch {
        location.href = '/workout.html';
      }
    }

    const name = localStorage.getItem('gymName') || 'Пользователь';
    document.getElementById('user-name').textContent = name;
    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
    document.getElementById('user-greeting').textContent = greeting + '! Готов к тренировке?';
    const avatarData = localStorage.getItem('gymAvatar');
    const avatarWrap = document.getElementById('user-avatar-wrap');
    if (avatarData) {
      avatarWrap.innerHTML = `<div class="user-avatar"><img src="${avatarData}" alt=""></div>`;
    } else {
      avatarWrap.innerHTML = `<div class="user-avatar">${name[0].toUpperCase()}</div>`;
    }

    renderCalendar(); // show calendar grid immediately, highlights come after
    renderHabits();
    loadWorkouts();
    loadHabits();
  </script>
</body>
</html>
